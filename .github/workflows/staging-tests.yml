name: Staging smoke tests

# يشغّل tests/smoke.staging.mjs تلقائيًا ضد بيئة الاختبار المنفصلة تمامًا
# (nwfgsaumkubferjjsuny) — لا صلة بمشروع الإنتاج إطلاقًا ولا يلمسه أبدًا.
# مفاتيح البيئة مضمَّنة داخل الملف نفسه (anon + service_role الخاصان ببيئة
# الاختبار فقط، مفاتيح علنية بالتصميم — نفس مبدأ المفتاح المضمَّن في index.html).
#
# ملحوظة: هذا يُظهر النتيجة في تبويب Actions فقط. لمنع الدمج فعليًا عند
# الفشل، لازم تفعيل "Require status checks to pass" لفرع main من
# GitHub → Settings → Branches — قرار إداري لم يُفعَّل هنا عمدًا.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run staging smoke tests
        run: node tests/smoke.staging.mjs
